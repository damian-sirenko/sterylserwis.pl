    <div class="contact__form-card">
      <h3 class="contact__form-title">Masz pytanie? Napisz do nas</h3>
      <form class="contact__form" id="contact-form" method="POST" novalidate>
        <input type="hidden" name="access_key" value="674a91e4-cb0e-4621-a6fe-33522af79ee4" />
        <input type="hidden" name="form_name" value="Formularz kontaktowy" />
        <input type="hidden" name="subject" value="Wiadomość z formularza kontaktowego STERYL SERWIS" />
        <input class="contact__honeypot" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <div class="contact__field">
          <label class="contact__field-label" for="contact-name">Imię</label>
          <input class="contact__input" id="contact-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="contact__field">
          <label class="contact__field-label" for="contact-email">E-mail</label>
          <input class="contact__input" id="contact-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="contact__field">
          <label class="contact__field-label" for="contact-message">Wiadomość</label>
          <textarea class="contact__input contact__textarea" id="contact-message" name="message" rows="4" required></textarea>
        </div>
        <label class="contact__check" for="contact-accept">
          <input id="contact-accept" name="accept" type="checkbox" required />
          <span>Akceptuję <a href="./private_policy.html" target="_blank" rel="noopener">politykę prywatności</a></span>
        </label>

        <button class="contact__submit" type="submit">Wyślij wiadomość</button>
        <p class="contact__status" id="contact-status" role="status" aria-live="polite"></p>
      </form>
    </div>
