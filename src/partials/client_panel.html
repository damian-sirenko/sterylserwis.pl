<section class="cpanel" id="panel-klienta">
  <div class="cpanel__inner">
    <div class="cpanel__head">
      <p class="cpanel__eyebrow">Panel Klienta <span class="cpanel__badge">dla klientów z umową</span></p>
      <h2 class="cpanel__title">Cała dokumentacja współpracy w jednym miejscu</h2>
      <p class="cpanel__intro">
        W Panelu Klienta online masz dostęp do faktur, testów biologicznych i
        kart sterylizacji Twoich narzędzi — o każdej porze.
      </p>
    </div>

    <div class="cpanel__device">
      <button class="cpanel__phone" type="button" aria-label="Powiększ zrzut ekranu Panelu Klienta">
        <span class="cpanel__phone-screen">
          <img class="cpanel__screen is-active" src="./img/client_panel/panel-dashboard.webp" alt="Pulpit klienta — status rozliczeń i limit pakietów" width="720" loading="lazy" data-screen="0" />
          <img class="cpanel__screen" src="./img/client_panel/panel-nowe-przekazanie.webp" alt="Nowe przekazanie narzędzi do sterylizacji" width="720" loading="lazy" data-screen="1" />
          <img class="cpanel__screen" src="./img/client_panel/panel-faktury.webp" alt="Lista faktur ze statusem płatności" width="720" loading="lazy" data-screen="2" />
          <img class="cpanel__screen" src="./img/client_panel/panel-testy.webp" alt="Historia testów biologicznych wg miesięcy" width="720" loading="lazy" data-screen="3" />
          <img class="cpanel__screen" src="./img/client_panel/panel-karta-sterylizacji.webp" alt="Karta sterylizacji narzędzi do pobrania" width="720" loading="lazy" data-screen="4" />
        </span>
        <span class="cpanel__zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></span>
      </button>
    </div>

    <div class="cpanel__side">
      <ul class="cpanel__features" aria-label="Funkcje Panelu Klienta">
        <li>
          <button class="cpanel__feature is-active" type="button" data-screen="0" aria-pressed="true">
            <span class="cpanel__feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></span>
            <span class="cpanel__feature-body">
              <span class="cpanel__feature-title">Limit pakietów i rozliczenia</span>
              <span class="cpanel__feature-text">Widzisz, ile pakietów wykorzystałeś w bieżącym miesiącu i czy wszystkie faktury są opłacone.</span>
            </span>
            <span class="cpanel__progress" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="cpanel__feature" type="button" data-screen="1" aria-pressed="false">
            <span class="cpanel__feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg></span>
            <span class="cpanel__feature-body">
              <span class="cpanel__feature-title">Zgłoszenie przekazania narzędzi</span>
              <span class="cpanel__feature-text">Zgłaszasz narzędzia online: wybierasz sposób dostarczenia i narzędzia z katalogu albo z zapisanego szablonu.</span>
            </span>
            <span class="cpanel__progress" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="cpanel__feature" type="button" data-screen="2" aria-pressed="false">
            <span class="cpanel__feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg></span>
            <span class="cpanel__feature-body">
              <span class="cpanel__feature-title">Faktury i status płatności</span>
              <span class="cpanel__feature-text">Wszystkie faktury i status ich płatności w jednym miejscu — bez szukania w mailach czy segregatorach.</span>
            </span>
            <span class="cpanel__progress" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="cpanel__feature" type="button" data-screen="3" aria-pressed="false">
            <span class="cpanel__feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></span>
            <span class="cpanel__feature-body">
              <span class="cpanel__feature-title">Testy biologiczne</span>
              <span class="cpanel__feature-text">Comiesięczne wyniki testów biologicznych dla każdego autoklawu — dostępne zawsze, także podczas kontroli.</span>
            </span>
            <span class="cpanel__progress" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="cpanel__feature" type="button" data-screen="4" aria-pressed="false">
            <span class="cpanel__feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg></span>
            <span class="cpanel__feature-body">
              <span class="cpanel__feature-title">Karta sterylizacji</span>
              <span class="cpanel__feature-text">Data i numer cyklu, autoklaw oraz parametry procesu: temperatura, ciśnienie i czas sterylizacji.</span>
            </span>
            <span class="cpanel__progress" aria-hidden="true"></span>
          </button>
        </li>
      </ul>
      <p class="cpanel__caption" aria-live="polite"></p>

      <div class="cpanel__actions">
        <a class="cpanel__btn" href="https://panel.sterylserwis.pl" target="_blank" rel="noopener noreferrer">Zaloguj się do Panelu</a>
        <a class="cpanel__btn cpanel__btn--outline" href="#offer">Wybierz abonament</a>
      </div>
    </div>
  </div>

  <dialog class="cpanel__lightbox" id="cpanel-lightbox" aria-label="Powiększony zrzut ekranu">
    <button class="cpanel__lightbox-close" type="button" aria-label="Zamknij powiększenie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img class="cpanel__lightbox-img" src="" alt="" />
  </dialog>
</section>
